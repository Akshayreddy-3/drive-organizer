# Builds the packaged apps: a Mac disk image and a Windows installer.
# Runs on every push (free on a public repository), or when you press "Run workflow" on GitHub.
# A version tag like v1.0 also publishes both files on the repository's Releases page, which is the link to share.
name: Build apps

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller

      - name: Build (Mac)
        if: runner.os == 'macOS'
        run: packaging/build_mac.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller packaging/drive_organizer.spec --noconfirm
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows_installer.iss

      - name: Check the packaged app can run its own scripts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then app="dist/Drive Organizer.app/Contents/MacOS/Drive Organizer"
          else app="dist/Drive Organizer/Drive Organizer.exe"; fi
          "$app" ai_pdf_renamer.py --help | grep -- "--dry-run"
          "$app" run_upload.py --help | grep -- "--preview"

      - uses: actions/upload-artifact@v4
        with:
          name: Drive-Organizer-${{ runner.os }}
          path: |
            dist/Drive-Organizer-Mac.dmg
            dist/Drive-Organizer-Setup.exe

      - name: Publish on the Releases page
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            **Mac (Apple silicon):** download `Drive-Organizer-Mac.dmg`, open it, and drag Drive Organizer onto Applications. The first open is blocked once: go to System Settings > Privacy & Security and click "Open Anyway".

            **Windows:** download and run `Drive-Organizer-Setup.exe`. On the blue warning box, click "More info", then "Run anyway".

            Nothing else to install: Python and everything the app needs are inside. Setup continues in the app's Settings page.
          files: |
            dist/Drive-Organizer-Mac.dmg
            dist/Drive-Organizer-Setup.exe
