# Builds the packaged apps: a Mac disk image and a Windows installer.
# Runs on every push (free on a public repository), or when you press "Run workflow" on GitHub.
# To publish a new version: change the number in packaging/VERSION and push. The first build with
# a new number puts both files on the repository's Releases page, which is the link to share.
name: Build apps

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller

      - name: Build (Mac)
        if: runner.os == 'macOS'
        run: packaging/build_mac.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller packaging/drive_organizer.spec --noconfirm
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$((Get-Content packaging\VERSION).Trim())" packaging\windows_installer.iss

      - name: Test the packaged app end to end (Mac)
        if: runner.os == 'macOS'
        timeout-minutes: 25
        run: python packaging/smoke_test.py "dist/Drive Organizer.app/Contents/MacOS/Drive Organizer"

      - name: Install it, check the shortcuts, test the installed app end to end, uninstall (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 25
        run: |
          Start-Process -Wait dist\Drive-Organizer-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon'
          $folder = "$env:LOCALAPPDATA\Programs\Drive Organizer"
          $exe = "$folder\Drive Organizer.exe"
          if (-not (Test-Path $exe)) { throw "The installer did not install the app" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Drive Organizer.lnk'))) { throw "No Desktop shortcut" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Drive Organizer.lnk")) { throw "No Start menu shortcut" }
          python packaging/smoke_test.py $exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Start-Process -Wait "$folder\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          foreach ($i in 1..30) { if (-not (Test-Path $exe)) { break }; Start-Sleep 1 }
          if (Test-Path $exe) { throw "The uninstaller left the app behind" }
          if (-not (Test-Path "$env:APPDATA\Drive Organizer\.env")) { throw "Uninstalling removed the user's settings" }

      - uses: actions/upload-artifact@v4
        with:
          name: Drive-Organizer-${{ runner.os }}
          path: |
            dist/Drive-Organizer-Mac.dmg
            dist/Drive-Organizer-Setup.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Is the number in packaging/VERSION a new version?
        id: version
        run: |
          tag="v$(tr -d '[:space:]' < packaging/VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"
          else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Publish on the Releases page
        if: steps.version.outputs.new == 'true'
        run: >
          gh release create "${{ steps.version.outputs.tag }}"
          dist/Drive-Organizer-Mac.dmg dist/Drive-Organizer-Setup.exe
          --target "$GITHUB_SHA" --title "Drive Organizer ${{ steps.version.outputs.tag }}"
          --notes-file packaging/RELEASE_NOTES.md
